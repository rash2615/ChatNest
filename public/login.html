<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ChatNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #8B6F47 0%, #6B4E3D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #FAF5F0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(107, 78, 61, 0.4);
            border: 2px solid #D4C4B0;
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #6B4E3D;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .logo p {
            color: #5D4037;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5D4037;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D4C4B0;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            background: #FFFFFF;
            color: #3E2723;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8B6F47;
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8B6F47 0%, #6B4E3D 100%);
            color: #FAF5F0;
            border: 2px solid #6B4E3D;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #9D7A5A 0%, #7D5A3D 100%);
            box-shadow: 0 4px 12px rgba(107, 78, 61, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #F0E6D2;
            color: #6B4E3D;
            border: 2px solid #8B6F47;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #E8D5C4;
            border-color: #6B4E3D;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #E8D5C4;
            color: #5D4037;
            border: 2px solid #A0826D;
        }

        .alert-error {
            background: #F0E6D2;
            color: #6B4E3D;
            border: 2px solid #8B6F47;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            color: #7D5A3D;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #D4C4B0;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .quick-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .quick-login button {
            padding: 10px;
            background: #F0E6D2;
            border: 1px solid #D4C4B0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Times New Roman', Times, serif;
            color: #5D4037;
            transition: all 0.2s;
        }

        .quick-login button:hover {
            background: #E8D5C4;
            border-color: #8B6F47;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7D5A3D;
            font-size: 14px;
        }

        .footer a {
            color: #8B6F47;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>💬 ChatNest</h1>
            <p>Connectez-vous à votre compte</p>
        </div>

        <div id="alertMessage"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <div class="divider">ou</div>

        <div class="quick-login">
            <button onclick="quickLogin('user1@test.com', 'password123')">👤 User 1</button>
            <button onclick="quickLogin('user2@test.com', 'password123')">👤 User 2</button>
        </div>
        <div style="text-align: center; margin-top: 10px; font-size: 12px; color: #666;">
            <p>Les comptes seront créés automatiquement s'ils n'existent pas</p>
        </div>

        <button class="btn-secondary" onclick="window.location.href='register.html'">
            Créer un compte
        </button>

        <div class="footer">
            <p>Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    // Stocker le token et les infos utilisateur
                    // Le serveur renvoie accessToken (camelCase) ou access_token (snake_case)
                    const token = data.accessToken || data.access_token;
                    if (token) {
                        localStorage.setItem('token', token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        showAlert('Connexion réussie ! Redirection...', 'success');
                        setTimeout(() => {
                            window.location.href = 'chat.html';
                        }, 1000);
                    } else {
                        console.error('Réponse du serveur:', data);
                        showAlert('Erreur: Token non reçu du serveur. Réponse: ' + JSON.stringify(data));
                    }
                } else {
                    showAlert(data.message || 'Email ou mot de passe incorrect');
                }
            } catch (error) {
                showAlert(`Erreur: ${error.message}`);
            }
        }

        async function quickLogin(email, password) {
            // Désactiver les boutons pendant le traitement
            const btn1 = document.querySelector('button[onclick*="user1@test.com"]');
            const btn2 = document.querySelector('button[onclick*="user2@test.com"]');
            if (btn1) btn1.disabled = true;
            if (btn2) btn2.disabled = true;
            
            // Afficher un message de chargement
            showAlert('Connexion en cours...', 'success');
            
            // Remplir les champs
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            
            // Essayer de se connecter
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Connexion réussie
                    // Le serveur renvoie accessToken (camelCase) ou access_token (snake_case)
                    const token = data.accessToken || data.access_token;
                    if (token) {
                        localStorage.setItem('token', token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        showAlert('Connexion réussie ! Redirection...', 'success');
                        setTimeout(() => {
                            window.location.href = 'chat.html';
                        }, 1000);
                        return;
                    } else {
                        console.error('Réponse du serveur:', data);
                        showAlert('Erreur: Token non reçu du serveur. Réponse: ' + JSON.stringify(data));
                        if (btn1) btn1.disabled = false;
                        if (btn2) btn2.disabled = false;
                        return;
                    }
                }
                
                // Si erreur 401, le compte n'existe pas ou le mot de passe est incorrect
                if (response.status === 401) {
                    console.log('Erreur 401 - Tentative de création du compte...');
                    const username = email.split('@')[0];
                    showAlert('Création automatique du compte de test...', 'success');
                    
                    try {
                        const registerResponse = await fetch(`${API_URL}/auth/register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password, username })
                        });

                        const registerData = await registerResponse.json();
                        
                        if (registerResponse.ok) {
                            // Compte créé avec succès
                            // Le serveur renvoie accessToken (camelCase) ou access_token (snake_case)
                            const token = registerData.accessToken || registerData.access_token;
                            if (token) {
                                localStorage.setItem('token', token);
                                localStorage.setItem('user', JSON.stringify(registerData.user));
                                showAlert('✅ Compte créé et connexion réussie ! Redirection...', 'success');
                                setTimeout(() => {
                                    window.location.href = 'chat.html';
                                }, 1000);
                                return;
                            } else {
                                console.error('Réponse du serveur (register):', registerData);
                                showAlert('Compte créé mais erreur de connexion. Réponse: ' + JSON.stringify(registerData));
                            }
                        } else {
                            // Erreur lors de la création
                            if (registerResponse.status === 409) {
                                // Le compte existe déjà mais le mot de passe est peut-être incorrect
                                showAlert('Ce compte existe déjà. Si le mot de passe est incorrect, veuillez vous inscrire manuellement avec un autre email.');
                            } else {
                                showAlert(`Erreur lors de la création: ${registerData.message || 'Erreur inconnue'}`);
                            }
                        }
                    } catch (registerError) {
                        console.error('Erreur lors de la création:', registerError);
                        showAlert(`Erreur lors de la création du compte: ${registerError.message}`);
                    }
                } else {
                    showAlert(data.message || 'Erreur de connexion');
                }
            } catch (error) {
                console.error('Erreur lors de la connexion:', error);
                showAlert(`Erreur de connexion: ${error.message}. Vérifiez que le serveur est démarré.`);
            } finally {
                // Réactiver les boutons
                if (btn1) btn1.disabled = false;
                if (btn2) btn2.disabled = false;
            }
        }

        // Vérifier si déjà connecté
        if (localStorage.getItem('token')) {
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
