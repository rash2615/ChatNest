<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ChatNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(135deg, #8B6F47 0%, #6B4E3D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: #FAF5F0;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(107, 78, 61, 0.4);
            border: 2px solid #D4C4B0;
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #6B4E3D;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #5D4037;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D4C4B0;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            background: #FFFFFF;
            color: #3E2723;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8B6F47;
            box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.2);
        }

        .form-group input.error {
            border-color: #8B6F47;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8B6F47 0%, #6B4E3D 100%);
            color: #FAF5F0;
            border: 2px solid #6B4E3D;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #9D7A5A 0%, #7D5A3D 100%);
            box-shadow: 0 4px 12px rgba(107, 78, 61, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: #F0E6D2;
            color: #6B4E3D;
            border: 2px solid #8B6F47;
            border-radius: 6px;
            font-size: 16px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #E8D5C4;
            border-color: #6B4E3D;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #E8D5C4;
            color: #5D4037;
            border: 2px solid #A0826D;
        }

        .alert-error {
            background: #F0E6D2;
            color: #6B4E3D;
            border: 2px solid #8B6F47;
        }

        .alert-error a {
            color: #667eea;
            text-decoration: underline;
            font-weight: bold;
        }

        .password-requirements {
            font-size: 12px;
            color: #7D5A3D;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #7D5A3D;
            font-size: 14px;
        }

        .footer a {
            color: #8B6F47;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>💬 ChatNest</h1>
            <p>Créez votre compte</p>
        </div>

        <div id="alertMessage"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="username">Nom d'utilisateur *</label>
                <input type="text" id="username" name="username" placeholder="johndoe" required minlength="3">
                <div class="password-requirements">Minimum 3 caractères</div>
            </div>

            <div class="form-group">
                <label for="email">Adresse email *</label>
                <input type="email" id="email" name="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe *</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                <div class="password-requirements">Minimum 6 caractères</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Prénom</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John">
                </div>

                <div class="form-group">
                    <label for="lastName">Nom</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe">
                </div>
            </div>

            <button type="submit" class="btn-primary">Créer mon compte</button>
        </form>

        <button class="btn-secondary" onclick="window.location.href='login.html'">
            J'ai déjà un compte
        </button>

        <div class="footer">
            <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';

        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            // Réinitialiser les styles d'erreur
            document.getElementById('username').style.borderColor = '';
            document.getElementById('email').style.borderColor = '';
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;

            if (username.length < 3) {
                showAlert('Le nom d\'utilisateur doit contenir au moins 3 caractères');
                document.getElementById('username').classList.add('error');
                return;
            }

            if (password.length < 6) {
                showAlert('Le mot de passe doit contenir au moins 6 caractères');
                document.getElementById('password').classList.add('error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        firstName: firstName || undefined,
                        lastName: lastName || undefined,
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    // Stocker le token et les infos utilisateur
                    // Le serveur renvoie accessToken (camelCase) ou access_token (snake_case)
                    const token = data.accessToken || data.access_token;
                    if (token) {
                        localStorage.setItem('token', token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        showAlert('Inscription réussie ! Redirection...', 'success');
                        setTimeout(() => {
                            window.location.href = 'chat.html';
                        }, 1000);
                    } else {
                        console.error('Réponse du serveur:', data);
                        showAlert('Erreur: Token non reçu du serveur. Réponse: ' + JSON.stringify(data));
                    }
                } else {
                    // Gérer les erreurs spécifiques
                    let errorMessage = 'Erreur lors de l\'inscription';
                    if (response.status === 409) {
                        // Conflit - email ou username déjà utilisé
                        const message = data.message || '';
                        if (message.includes('email') || message.includes('Email')) {
                            errorMessage = 'Cet email est déjà utilisé. <a href="login.html" style="color: #8B6F47; text-decoration: underline;">Connectez-vous</a> ou choisissez un autre email.';
                            // Mettre en évidence le champ email
                            document.getElementById('email').classList.add('error');
                            setTimeout(() => {
                                document.getElementById('email').classList.remove('error');
                            }, 3000);
                        } else if (message.includes('username') || message.includes('nom d\'utilisateur') || message.includes('pris')) {
                            errorMessage = 'Ce nom d\'utilisateur est déjà pris. Veuillez en choisir un autre.';
                            // Mettre en évidence le champ username
                            document.getElementById('username').classList.add('error');
                            setTimeout(() => {
                                document.getElementById('username').classList.remove('error');
                            }, 3000);
                        } else {
                            errorMessage = 'Cet email ou ce nom d\'utilisateur est déjà utilisé.';
                        }
                    } else if (response.status === 400) {
                        errorMessage = data.message || 'Données invalides. Vérifiez vos informations.';
                    } else {
                        errorMessage = data.message || 'Erreur lors de l\'inscription';
                    }
                    showAlert(errorMessage);
                }
            } catch (error) {
                showAlert(`Erreur: ${error.message}`);
            }
        }

        // Vérifier si déjà connecté
        if (localStorage.getItem('token')) {
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
